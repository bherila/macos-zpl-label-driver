name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PULL REQUEST runs are cancelled; runs on `main` are not.
#
# Cancelling is keyed on the concurrency group, and for a push the group is the
# ref, so `cancel-in-progress: true` cancelled `main` pushes exactly as it
# cancelled pull requests. Merging faster than one macOS build then left the
# merged tree with no native compilation at all: five merges landed inside ten
# minutes, each push cancelling the last, and the only run that would have
# compiled the combined tree died that way. The surviving run classified its own
# diff as documentation-only and skipped the macOS job legitimately, so
# `ci-required` still reported green -- every assertion it makes was true, and
# the combination had simply never been built.
#
# A `main` push is the merged result and the last chance to compile it, so it
# now queues behind its predecessor instead of replacing it. `workflow_dispatch`
# shares the ref group and is likewise never cancelled, so a manual verification
# run cannot be killed by an unrelated merge landing mid-build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: repository-preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      swift_changed: ${{ steps.scope.outputs.swift_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate repository
        run: |
          python3 scripts/check_repo.py
          python3 -m unittest discover -s scripts/tests
      # Read-only. Neither diagnostic rewrites evidence, refreshes a digest or promotes a claim,
      # and each exits 2 rather than 0 when it cannot evaluate its input.
      #
      # `--gate-stale` is deliberately passed on NEITHER event, pull_request or push. A source
      # slice necessarily stales every record until its re-seal slice lands, so gating staleness
      # on pull requests would fail the PR doing the work and make deleting records the cheapest
      # green. Gating only `push` would close the hole on main at the price of a red required
      # check between every source merge and its re-seal. That is a maintainer decision about the
      # branch and it is open: see the "STALE-SOURCE is reported on every event" section of
      # docs/TRACEABILITY.md. Until it is taken, staleness on main is visible in this log and is
      # not enforced. Every other finding this step reports still gates on both events.
      - name: Acceptance evidence currency
        run: python3 scripts/evidence_currency.py
      # ADR 0004 step 2. `--enforce-covered` gates only on entries the manifest
      # ALREADY claims: a drifted digest, a path that no longer exists, an entry
      # naming an untracked file. All three read zero, so this changes no build
      # outcome today; it stops the manifest drifting silently again the way it
      # did between 55a9ef5 and 56fdc7b. Coverage itself is gated separately.
      # ADR 0004 steps 2 and 3, both now on. `--enforce-covered` gates on an entry
      # the manifest already claims having drifted, gone missing, or naming an
      # untracked file; `--enforce-coverage` gates on a tracked file carrying no
      # digest at all. The backfill took coverage to whole-tree, restoring the
      # convention this repository held for twenty commits before 56fdc7b broke
      # it, so one command now answers "has any tracked byte changed without
      # being recorded". The cost is a refresh on every PR touching a covered
      # file: `python3 scripts/refresh_manifest.py` pays it.
      - name: Manifest integrity and whole-tree coverage
        run: python3 scripts/manifest_audit.py --enforce-covered --enforce-coverage
      - name: Classify change scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_scope.py

  macos:
    name: swift-macos-arm64
    needs: repository
    if: needs.repository.outputs.swift_changed == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      EXPECTED_ARCH: arm64
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Identify Swift cache toolchain
        id: swift-cache-key
        shell: bash
        run: |
          toolchain=$( { swift --version; xcodebuild -version; xcrun --show-sdk-version; uname -m; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "prefix=swift-build-v1-${RUNNER_OS}-${RUNNER_ARCH}-${MACOSX_DEPLOYMENT_TARGET}-${toolchain}" >> "$GITHUB_OUTPUT"
      - name: Restore Swift build cache
        id: swift-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Packages/LabelCore/.build
            Packages/LabelMac/.build
          key: ${{ steps.swift-cache-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.swift-cache-key.outputs.prefix }}-
      - name: Native Swift build, tests and local-signature smoke
        shell: bash
        run: |
          mkdir -p build-logs
          bash scripts/ci-swift.sh 2>&1 | tee build-logs/macos.log
      # Only successful main pushes publish caches; PRs only restore them.
      # Cache hits never skip any build, test, oracle or signature check.
      - name: Save Swift build cache from main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            Packages/LabelCore/.build
            Packages/LabelMac/.build
          key: ${{ steps.swift-cache-key.outputs.prefix }}-${{ github.sha }}
      - name: Retain short-lived diagnostic log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/macos.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Package tested local-ad-hoc app from main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find artifacts -maxdepth 2 -type d -name 'Label Printer Driver Setup.app' -print -quit)"
          [[ -n "$app_path" && -d "$app_path" ]]
          mkdir -p ci-artifact
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "ci-artifact/Label-Printer-Driver-Setup-${GITHUB_SHA}.zip"
          shasum -a 256 "ci-artifact/Label-Printer-Driver-Setup-${GITHUB_SHA}.zip" > ci-artifact/SHA256SUMS
          {
            echo "source-sha=${GITHUB_SHA}"
            echo "artifact=Label-Printer-Driver-Setup-${GITHUB_SHA}.zip"
            echo "signature-mode=local-ad-hoc"
            echo "architecture=arm64"
            echo "minimum-macos=26.0"
            echo "scope=CI-tested build artifact; no installation, scheduler, GUI, Gatekeeper, or printer qualification"
          } > ci-artifact/BUILD-METADATA.txt
      - name: Upload tested local-ad-hoc app
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: label-printer-driver-setup-${{ github.sha }}
          path: ci-artifact
          retention-days: 3
          if-no-files-found: error

  required:
    name: ci-required
    needs: [repository, macos]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Check all required results
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          SWIFT_NEEDED: ${{ needs.repository.outputs.swift_changed }}
          MACOS_RESULT: ${{ needs.macos.result }}
        shell: bash
        run: |
          test "$REPOSITORY_RESULT" = "success"
          if [[ "$SWIFT_NEEDED" == "true" ]]; then
            test "$MACOS_RESULT" = "success"
          elif [[ "$SWIFT_NEEDED" == "false" ]]; then
            test "$MACOS_RESULT" = "skipped"
          else
            echo "Missing scope result; refusing a false green." >&2
            exit 1
          fi
